# Keeps the published gallery current, with no person or AI in the loop.
#
# Every 30 minutes, and on every push to the default branch, GitHub runs the
# same update the local scheduled task runs (python -m cts1_gallery update),
# commits any new pictures and site data back to the repository, and
# publishes site/ to GitHub Pages. A scheduled run that finds nothing new
# commits and publishes nothing.
#
# One-time setup: Settings > Pages > Source: "GitHub Actions".

name: Update and publish

on:
  schedule:
    - cron: "11,41 * * * *" # every 30 minutes, off the busy top of the hour
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit regenerated site data
  pages: write
  id-token: write

# One run at a time; a queued run waits rather than cancelling a deployment.
concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # The synced parquet tables, place names and render manifest from the
      # last run, so a run only fetches what changed upstream (about 1 MB)
      # instead of the whole ~23 MB the first run takes.
      - name: Restore the data cache
        uses: actions/cache/restore@v5
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-cache-

      - name: Sync packets and rebuild pictures
        run: python -m cts1_gallery update
        env:
          PYTHONUTF8: "1"

      - name: Save the data cache
        uses: actions/cache/save@v5
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit new pictures and site data
        id: commit
        run: |
          git add site/data/images.json site/data/tle.json site/images
          if git diff --cached --quiet; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update pictures and site data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
