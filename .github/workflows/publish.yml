# Keeps the published gallery current, with no person or AI in the loop.
#
# Twice a day, and on every push to the default branch, GitHub runs the
# same update the local scheduled task runs (python -m cts1_gallery update),
# commits any new pictures and site data back to the repository, and
# publishes site/ to GitHub Pages. A scheduled run that finds nothing new
# commits nothing; the event watchlist (below) changes every hour, so each
# scheduled run republishes it. To pick up a downlink straight away, run the
# workflow by hand (Actions > Update and publish > Run workflow).
#
# One-time setup: Settings > Pages > Source: "GitHub Actions".

name: Update and publish

on:
  schedule:
    # 04:00 and 16:00 UTC: 10 PM and 10 AM in Calgary on daylight time
    # (9 PM and 9 AM on standard time, Nov to Mar; cron can't follow DST).
    - cron: "0 4,16 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit regenerated site data
  pages: write
  id-token: write

# One run at a time; a queued run waits rather than cancelling a deployment.
concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.commit.outputs.changed == 'true' || steps.watch.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # The synced parquet tables, place names and render manifest from the
      # last run, so a run only fetches what changed upstream (about 1 MB)
      # instead of the whole ~23 MB the first run takes.
      - name: Restore the data cache
        uses: actions/cache/restore@v5
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-cache-

      - name: Sync packets and rebuild pictures
        run: python -m cts1_gallery update
        env:
          PYTHONUTF8: "1"

      # Things on Earth worth photographing and the satellite's coming passes
      # over them (site/data/watchlist.json, not committed). Each event feed
      # is fetched at most hourly and kept in data/cache/watch, so a feed
      # that's down leaves its last good answer; a failure here never stops
      # the publish, it republishes the last list. The list changes when
      # the hour does (it starts on the hour), so it publishes hourly.
      - name: Refresh the event watchlist
        id: watch
        continue-on-error: true
        run: |
          before=$(sha256sum data/cache/watch/watchlist.json 2>/dev/null || true)
          if ! python -m cts1_gallery watch; then
            echo "::warning::The watchlist couldn't be refreshed; publishing the last one."
            mkdir -p site/data
            cp data/cache/watch/watchlist.json site/data/ 2>/dev/null || true
          fi
          after=$(sha256sum data/cache/watch/watchlist.json 2>/dev/null || true)
          if [ "$before" != "$after" ]; then echo "changed=true"; else echo "changed=false"; fi >> "$GITHUB_OUTPUT"
        env:
          PYTHONUTF8: "1"

      - name: Save the data cache
        uses: actions/cache/save@v5
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit new pictures and site data
        id: commit
        run: |
          git add site/data/images.json site/data/tle.json site/images
          if git diff --cached --quiet; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update pictures and site data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.commit.outputs.changed == 'true' || steps.watch.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - if: steps.commit.outputs.changed == 'true' || steps.watch.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
