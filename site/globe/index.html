<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orbit globe · CTS-SAT-1</title>
  <meta name="description" content="Where CTS-SAT-1 (FrontierSat) is now, where it was when each photo was taken, and when it next passes over Calgary.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070A">
  <link rel="icon" type="image/png" href="../assets/cubesat-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="modulepreload" href="globe.js">
  <link rel="modulepreload" href="vendor/three.module.min.js">
  <link rel="modulepreload" href="vendor/satellite.es.js">
  <link rel="stylesheet" href="../assets/nav.css">
  <style>
    :root {
      --nav-h: var(--nav-bar);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #05070A;
    }

    /* viewport-fit=cover lets the narrow dock pad for the home indicator;
       keep the whole globe clear of a landscape phone's notch. The globe's
       corners start below the site nav (--cg-top). */
    #globe {
      --cg-top: var(--nav-h);
      position: fixed;
      inset: 0;
      padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
    }

    /* The site's nav (assets/nav.css), laid over the stage with no bar behind it. */
    .site-nav {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 10;
    }

    .skip-link {
      position: fixed;
      top: -100px;
      left: 16px;
      z-index: 20;
      padding: 8px 12px;
      background: #E6EBF0;
      color: #05070A;
      font: 500 14px/1.4 "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .skip-link:focus {
      top: 8px;
    }

    #globe:focus {
      outline: none;
    }

    .nojs {
      margin: 0;
      padding: calc(var(--nav-h) + 24px) 24px 24px;
      font: 16px/1.5 "Jost", system-ui, sans-serif;
      color: #E6EBF0;
    }

    /* Shows with the HTML, before anything else has loaded; the globe replaces it. */
    .orbit-loading {
      position: absolute;
      inset: var(--nav-h) 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      font: 16px/1.5 "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      color: #E6EBF0;
    }
  </style>
  <noscript><style>.orbit-loading { display: none; }</style></noscript>
</head>
<body>
  <!-- by script, so the page's own #t=... state stays in the address -->
  <a class="skip-link" href="#globe" onclick="event.preventDefault();document.getElementById('globe').focus();">Skip to the globe</a>
  <nav class="site-nav is-over" aria-label="Main">
    <a class="brand" href="../index.html#/" aria-label="CTS-SAT-1, explore: where the satellite is now">
      <img class="brand-logo" src="../assets/calgarytospace-logo.png" width="640" height="204" alt="">
    </a>
    <div class="nav-links">
      <a href="../index.html#/">Explore</a>
      <a href="../index.html#/pictures">Pictures</a>
      <a href="index.html" aria-current="page">Orbit</a>
      <a href="../watchlist/index.html">Watchlist</a>
      <a href="../index.html#/about">About</a>
      <button type="button" class="nav-btn" id="credits">Credits</button>
    </div>
  </nav>
  <main id="globe" tabindex="-1" aria-label="CTS-SAT-1 orbit globe"><p class="orbit-loading" role="status">Loading the globe…</p></main>
  <noscript><p class="nojs">The orbit globe needs JavaScript and WebGL.</p></noscript>
  <script>
    // Browsers won't load ES modules or JSON from file:// pages.
    if (location.protocol === 'file:') {
      document.getElementById('globe').innerHTML =
        '<p class="nojs">Open this page through a web server, e.g. run ' +
        '<code>python -m http.server</code> in the site folder and visit /globe/.</p>';
    }
  </script>
  <!-- Here rather than in the head: the nav and the loading line above carry
       their own styles, so they show without waiting for any of these. The
       module below still waits for them, so the globe never appears unstyled. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="globe.css">
  <link rel="stylesheet" href="map2d.css">
  <link rel="stylesheet" href="timepick.css">
  <link rel="stylesheet" href="colorwheel.css">
  <link rel="stylesheet" href="placesearch.css">
  <link rel="stylesheet" href="shotpanel.css">
  <script type="module" onerror="var l=document.querySelector('.orbit-loading');if(l)l.textContent='The globe couldn’t load. Check your connection and reload the page.';">
    import { mountGlobe } from './globe.js';
    import { mountCredits } from '../assets/credits.js';

    mountCredits(document.getElementById('credits'));

    // ?photo=<id> focuses that photo; #t=<iso>&photo=<id> restores a shared view.
    // The site nav's Pictures link is the way back, so no "All pictures" link.
    const params = new URLSearchParams(location.search);
    mountGlobe(document.getElementById('globe'), {
      photoId: params.get('photo'),
      hashState: true,
      keyboard: 'global',
    });
    document.querySelector('.orbit-loading')?.remove();
  </script>
</body>
</html>
