<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orbit globe · CTS-SAT-1</title>
  <meta name="description" content="Where CTS-SAT-1 (FrontierSat) is now, where it was when each photo was taken, and when it next passes over Calgary.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="globe.css">
  <link rel="stylesheet" href="map2d.css">
  <link rel="stylesheet" href="timepick.css">
  <link rel="stylesheet" href="colorwheel.css">
  <link rel="modulepreload" href="globe.js">
  <link rel="modulepreload" href="vendor/three.module.min.js">
  <link rel="modulepreload" href="vendor/satellite.es.js">
  <style>
    :root {
      --nav-h: 60px;
      --nav-pad: 24px;
    }

    @media (max-width: 599px) {
      :root {
        --nav-h: 52px;
        --nav-pad: 16px;
      }
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #05070A;
    }

    /* viewport-fit=cover lets the narrow dock pad for the home indicator;
       keep the whole globe clear of a landscape phone's notch. The globe's
       corners start below the site nav (--cg-top). */
    #globe {
      --cg-top: var(--nav-h);
      position: fixed;
      inset: 0;
      padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
    }

    /* The site's nav, as on the front page's globe: laid over the stage with
       no bar behind it, and only its links take the pointer, so the globe
       still drags right up to them. */
    .site-nav {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: var(--nav-h);
      padding: 0 calc(var(--nav-pad) + env(safe-area-inset-right, 0px)) 0 calc(var(--nav-pad) + env(safe-area-inset-left, 0px));
      font: 500 14px/1 "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
      pointer-events: none;
    }

    .site-nav .brand,
    .site-nav .nav-links a,
    .site-nav .nav-btn {
      pointer-events: auto;
    }

    .site-nav .brand {
      display: flex;
      flex: none;
      align-items: center;
    }

    .site-nav .brand-logo {
      display: block;
      width: auto;
      height: 34px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      min-width: 0;
    }

    /* a taller hit area than the words, without moving them */
    .nav-links a,
    .nav-btn {
      padding: 14px 0;
      color: #E6EBF0;
      text-decoration: none;
      white-space: nowrap;
    }

    /* Credits opens a pop-up, so it's a button that looks like the links */
    .nav-btn {
      border: 0;
      background: none;
      font: inherit;
      cursor: pointer;
    }

    .nav-links a:hover,
    .nav-btn:hover,
    .nav-btn[aria-expanded="true"] {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 6px;
      text-decoration-color: rgba(230, 235, 240, 0.4);
    }

    .nav-links a[aria-current="page"] {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 6px;
      text-decoration-color: #3C9DF5;
    }

    .site-nav a:focus-visible,
    .site-nav .nav-btn:focus-visible {
      outline: 2px solid #3C9DF5;
      outline-offset: 2px;
    }

    /* six links and the logo on one line across a phone */
    @media (max-width: 599px) {
      .site-nav {
        gap: 10px;
        font-size: 13px;
      }

      .nav-links {
        gap: 10px;
      }

      .site-nav .brand-logo {
        height: 22px;
      }
    }

    @media (max-width: 430px) {
      .site-nav {
        gap: 8px;
        font-size: 12px;
      }

      .nav-links {
        gap: 8px;
      }

      .site-nav .brand-logo {
        height: 18px;
      }
    }

    .nojs {
      margin: 0;
      padding: calc(var(--nav-h) + 24px) 24px 24px;
      font: 16px/1.5 "Jost", system-ui, sans-serif;
      color: #E6EBF0;
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main">
    <a class="brand" href="../index.html#/" aria-label="CTS-SAT-1, explore: where the satellite is now">
      <img class="brand-logo" src="../assets/calgarytospace-logo.png" width="640" height="204" alt="">
    </a>
    <div class="nav-links">
      <a href="../index.html#/">Explore</a>
      <a href="../index.html#/pictures">Pictures</a>
      <a href="index.html" aria-current="page">Orbit</a>
      <a href="../watchlist/index.html">Watchlist</a>
      <a href="../index.html#/about">About</a>
      <button type="button" class="nav-btn" id="credits">Credits</button>
    </div>
  </nav>
  <main id="globe" aria-label="CTS-SAT-1 orbit globe"></main>
  <noscript><p class="nojs">The orbit globe needs JavaScript and WebGL.</p></noscript>
  <script>
    // Browsers won't load ES modules or JSON from file:// pages.
    if (location.protocol === 'file:') {
      document.getElementById('globe').innerHTML =
        '<p class="nojs">Open this page through a web server, e.g. run ' +
        '<code>python -m http.server</code> in the site folder and visit /globe/.</p>';
    }
  </script>
  <script type="module">
    import { mountGlobe } from './globe.js';
    import { mountCredits } from '../assets/credits.js';

    mountCredits(document.getElementById('credits'));

    // ?photo=<id> focuses that photo; #t=<iso>&photo=<id> restores a shared view.
    // The site nav's Pictures link is the way back, so no "All pictures" link.
    const params = new URLSearchParams(location.search);
    mountGlobe(document.getElementById('globe'), {
      photoId: params.get('photo'),
      hashState: true,
      keyboard: 'global',
    });
  </script>
</body>
</html>
