<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Map test · CTS-SAT-1</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="map2d.css">
  <link rel="stylesheet" href="timepick.css">
  <style>
    /* Test page for map2d.js and timepick.js without the rest of the
       globe: the real data, a clock, and the two new pieces. */
    html, body { height: 100%; margin: 0; background: #05070A; }
    .cg {
      --cg-bg: #05070A; --cg-panel: #10151B; --cg-raised: #1A2129; --cg-text: #E6EBF0;
      --cg-muted: #8A96A3; --cg-accent: #3C9DF5; --cg-sans: "Jost", system-ui, sans-serif;
      --cg-u: 1px; --cg-small: 13px; --cg-value: 16px; --cg-gap: 16px; --cg-pad: 16px;
      --cg-btn-h: 32px; --cg-clock-h: 64px;
      position: fixed; inset: 0; overflow: hidden; color: var(--cg-text);
      font: 400 16px/1.4 var(--cg-sans); font-variant-numeric: tabular-nums;
    }
    .cg * { box-sizing: border-box; }
    .cg [hidden] { display: none !important; }
    .cg button:focus-visible { outline: 2px solid var(--cg-accent); outline-offset: 2px; }
    .cg-stage { position: absolute; inset: 0; }
    .cg-fine { font-size: 13px; color: var(--cg-muted); }
    .dev-bar {
      position: absolute; right: 16px; bottom: 16px; left: 16px; z-index: 3;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
      min-height: 64px; padding: 8px 16px; background: var(--cg-panel);
    }
    .dev-bar button { height: 32px; padding: 0 12px; background: var(--cg-raised); border: 0;
      color: var(--cg-text); font: 500 13px/1 var(--cg-sans); cursor: pointer; }
    .dev-bar button[aria-pressed="true"] { background: var(--cg-text); color: var(--cg-bg); }
    .dev-time { background: none !important; padding: 0 !important; height: auto !important; text-align: left; }
    .dev-time b { display: block; font: 500 16px/1.3 var(--cg-sans); }
    .dev-time span { font: 400 13px/1.45 var(--cg-sans); color: var(--cg-muted); }
    .dev-pick { flex: 1 1 200px; min-width: 0; font-size: 13px; color: var(--cg-muted); }
    .cg-tip { position: absolute; top: 0; left: 0; z-index: 2; margin: 12px 0 0 12px; padding: 4px 8px;
      background: var(--cg-panel); font-size: 13px; white-space: nowrap; pointer-events: none; }
    .cg-narrow .dev-bar { right: 0; bottom: 0; left: 0; }
  </style>
</head>
<body>
  <div class="cg" id="root">
    <div class="cg-stage" id="stage"></div>
    <div class="cg-tip" id="tip" hidden></div>
    <div class="cg-views">
      <div class="cg-seg cg-seg-zoom" role="group" aria-label="Zoom">
        <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div class="dev-bar" id="bar">
      <button type="button" class="dev-time" id="timeBtn" aria-haspopup="dialog" aria-expanded="false"
        title="Pick a date and time"><b id="utc">—</b><span id="local"></span></button>
      <button type="button" id="play">Pause</button>
      <span role="group" aria-label="Speed" id="speeds">
        <button type="button" data-speed="1">1×</button><button type="button" data-speed="60">60×</button><button
          type="button" data-speed="600">600×</button><button type="button" data-speed="3600">3600×</button>
      </span>
      <button type="button" id="now">Now</button>
      <button type="button" id="follow" aria-pressed="false">Follow</button>
      <span class="dev-pick" id="picked"></span>
    </div>
  </div>
  <script type="module">
    import { annotationUrls, applyAnnotations, toPhotos } from './adapter.js';
    import * as astro from './astro.js';
    import { createMap } from './map2d.js';
    import { createTimePicker } from './timepick.js';

    const SITE = new URL('../', import.meta.url).href;
    const $ = (id) => document.getElementById(id);
    const root = $('root');
    const state = { ms: Date.now(), playing: true, speed: 1, live: true, follow: false, selected: null };
    const fromHash = Date.parse(new URLSearchParams(location.hash.slice(1)).get('t') || '');
    if (Number.isFinite(fromHash)) Object.assign(state, { ms: fromHash, playing: false, live: false });

    const map = createMap($('stage'), {
      textureBase: new URL('textures/', import.meta.url).href,
      reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
      onUserMove(kind) {
        if (kind === 'pan' && state.follow) setFollow(false);
      },
    });
    map.setStation(astro.CALGARY.latDeg, astro.CALGARY.lonDeg);

    let orbit = null;
    let photos = [];
    const picker = createTimePicker({
      launchMs: astro.LAUNCH_MS,
      getOrbit: () => orbit,
      onPick(ms) {
        Object.assign(state, { ms, playing: false, live: false });
        writeHash();
        paintTransport();
        push(true);
      },
    });
    root.appendChild(picker.element);
    $('timeBtn').addEventListener('click', () => picker.toggle(state.ms, $('timeBtn')));

    function layout() {
      const narrow = root.clientWidth < 760;
      root.classList.toggle('cg-narrow', narrow);
      const bar = $('bar').getBoundingClientRect();
      root.style.setProperty('--cg-dock-h', `${root.clientHeight - bar.top}px`);
      map.resize(root.clientWidth, root.clientHeight, 1, { bottom: root.clientHeight - bar.top + (narrow ? 0 : 16) });
    }
    new ResizeObserver(layout).observe(root);
    layout();
    map.setVisible(true);

    let trackKey = null;
    function push(forceTrack = false) {
      map.setTime(state.ms);
      const s = orbit && state.ms >= astro.LAUNCH_MS ? orbit.stateAt(state.ms) : null;
      map.setSatellite(s);
      if (!s) return;
      if (forceTrack || !trackKey || trackKey.index !== s.index || Math.abs(state.ms - trackKey.ms) > 10_000) {
        const period = orbit.periodMinutes(state.ms) * 60_000;
        const step = 30_000;
        const samples = [];
        for (let t = state.ms - Math.ceil(period / step) * step; t <= state.ms + 2 * period; t += step) {
          if (t < astro.LAUNCH_MS) continue;
          const p = orbit.stateAt(t, s.index);
          if (p) samples.push({ latDeg: p.latDeg, lonDeg: p.lonDeg, dtMin: (t - state.ms) / 60_000 });
        }
        map.setTrack(samples);
        trackKey = { index: s.index, ms: state.ms };
      }
    }

    const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'Etc/GMT+6', hour: '2-digit', minute: '2-digit',
      second: '2-digit', hourCycle: 'h23' });
    function paintClock() {
      const iso = new Date(state.ms).toISOString();
      $('utc').textContent = `${iso.slice(0, 10)}, ${iso.slice(11, 19)} UTC`;
      $('local').textContent = `${fmt.format(state.ms)} ABT in Calgary`;
    }
    function paintTransport() {
      $('play').textContent = state.playing ? 'Pause' : 'Play';
      for (const b of $('speeds').querySelectorAll('button')) b.setAttribute('aria-pressed', String(Number(b.dataset.speed) === state.speed));
      $('now').setAttribute('aria-pressed', String(state.live));
    }
    function writeHash() {
      history.replaceState(null, '', state.live ? location.pathname : `#t=${new Date(Math.round(state.ms / 1000) * 1000).toISOString().replace('.000Z', 'Z')}`);
    }
    function setFollow(on) {
      state.follow = on;
      $('follow').setAttribute('aria-pressed', String(on));
      if (on) map.flyToSatellite();
    }
    $('play').addEventListener('click', () => { state.playing = !state.playing; if (!state.playing) state.live = false; paintTransport(); writeHash(); });
    $('now').addEventListener('click', () => { Object.assign(state, { ms: Date.now(), live: true, playing: true, speed: 1 }); paintTransport(); writeHash(); push(true); });
    $('follow').addEventListener('click', () => setFollow(!state.follow));
    for (const b of $('speeds').querySelectorAll('button')) {
      b.addEventListener('click', () => { state.speed = Number(b.dataset.speed); if (state.speed !== 1) state.live = false; paintTransport(); });
    }
    $('zoomIn').addEventListener('click', () => map.zoomBy(2));
    $('zoomOut').addEventListener('click', () => map.zoomBy(0.5));

    // pins: hover and click, as on the globe
    const tip = $('tip');
    map.canvas.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse' || e.buttons) return;
      const r = map.canvas.getBoundingClientRect();
      const hit = map.pick(e.clientX - r.left, e.clientY - r.top);
      map.setHover(hit?.type === 'photo' ? hit.id : null);
      if (!hit) { tip.hidden = true; map.canvas.style.cursor = ''; return; }
      const p = photos.find((q) => q.id === hit.id);
      tip.textContent = hit.type === 'photo' ? `${p?.place || p?.title}, ${p?.capturedAtUTC}` :
        hit.type === 'satellite' ? 'Click to follow CTS-SAT-1' : hit.type === 'station' ? 'University of Calgary ground station' : 'The Sun is overhead here';
      tip.hidden = false;
      tip.style.transform = `translate(${Math.round(hit.x)}px, ${Math.round(hit.y)}px)`;
      map.canvas.style.cursor = hit.type === 'photo' || hit.type === 'satellite' ? 'pointer' : '';
    });
    map.canvas.addEventListener('pointerleave', () => { tip.hidden = true; map.setHover(null); });
    map.canvas.addEventListener('pointerup', (e) => {
      if (map.controls.dragged) return;
      const r = map.canvas.getBoundingClientRect();
      const hit = map.pick(e.clientX - r.left, e.clientY - r.top, e.pointerType === 'mouse' ? 12 : 22);
      if (hit?.type === 'photo') {
        const p = photos.find((q) => q.id === hit.id);
        state.selected = p.id;
        map.setSelected(p.id);
        Object.assign(state, { ms: p.ms, playing: false, live: false });
        $('picked').textContent = `${p.place || p.title}: ${p.capturedAtUTC}`;
        map.flyToGround(p.lat, p.lon);
        paintTransport();
        writeHash();
        push(true);
      } else if (hit?.type === 'satellite') setFollow(true);
    });

    let last = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(now - last, 250);
      last = now;
      if (state.playing) state.ms = state.live ? Date.now() : state.ms + dt * state.speed;
      push();
      if (state.follow) map.follow();
      map.frame(now);
      paintClock();
    }

    const get = (url) => fetch(url, { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : Promise.reject(new Error(url))));
    Promise.all([get(`${SITE}data/tle.json`), get(`${SITE}data/images.json`)]).then(async ([tles, images]) => {
      orbit = new astro.Orbit(tles);
      photos = toPhotos(images, { base: SITE });
      for (const url of annotationUrls(SITE)) {
        try { photos = applyAnnotations(photos, await get(url)); break; } catch {}
      }
      for (const p of photos) {
        p.ms = p.capturedAtUTC ? Date.parse(p.capturedAtUTC) : null;
        if (p.ms !== null && (p.lat === null || p.lon === null)) {
          const s = orbit.stateAt(p.ms);
          if (s) { p.lat = s.latDeg; p.lon = s.lonDeg; }
        }
      }
      map.setPins(photos.filter((p) => p.ms !== null && p.lat !== null).map((p) => ({ id: p.id, latDeg: p.lat, lonDeg: p.lon })));
      push(true);
      map.flyToSatellite({ immediate: true });
      picker.refresh();
    });
    paintTransport();
    requestAnimationFrame(frame);
    window.__dev = { map, picker, state };
  </script>
</body>
</html>
