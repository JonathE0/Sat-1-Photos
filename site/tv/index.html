<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrontierSat on a TV</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05070A">
  <link rel="icon" type="image/png" href="../assets/cubesat-icon.png">
  <!-- A short address for a screen nobody touches: the live view, bigger, keeping itself up to
       date (explore/?tv; setUpTv in explore/journey.js). Anything after ? is passed on. -->
  <script>
    location.replace('../explore/?tv' + (location.search ? '&' + location.search.slice(1) : '') + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=../explore/?tv">
  <style>html, body { margin: 0; background: #05070A; color: #E6EBF0; font: 18px/1.5 "Jost", Arial, sans-serif; } p { padding: 32px; }</style>
</head>
<body>
  <p>Opening <a href="../explore/?tv" style="color: inherit">the live view</a>…</p>
</body>
</html>
