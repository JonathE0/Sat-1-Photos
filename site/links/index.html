  <style>
    /* The page the QR code on the home page opens (on a TV, say): one tap to each place. Its own
       styles, so it opens fast on a phone; the colours are the site's. */
    :root {
      --bg: #05070A;
      --panel: #10151B;
      --raised: #1A2129;
      --fg: #E6EBF0;
      --bright: #F5F8FB;
      --label: #8A96A3;
      --accent: #3C9DF5;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(40px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--fg);
      font-family: "Jost", "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }
    main { width: 100%; max-width: 28rem; }
    header { display: grid; justify-items: center; gap: 4px; margin-bottom: 28px; text-align: center; }
    .icon { display: block; width: 88px; height: 88px; margin-bottom: 8px; }
    h1 { margin: 0; color: var(--bright); font-size: 32px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
    .sub { margin: 0; color: var(--label); font-size: 16px; }
    ul { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    a.link {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 16px;
      align-items: center;
      gap: 14px;
      min-height: 68px;
      padding: 12px 16px;
      background: var(--panel);
      box-shadow: inset 0 0 0 1px var(--raised);
      color: var(--fg);
      text-decoration: none;
      transition: background-color 160ms ease, box-shadow 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    a.link:hover { background: var(--raised); }
    a.link:active { background: var(--raised); box-shadow: inset 0 0 0 1px var(--label); }
    a.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    a.link.primary { background: var(--fg); box-shadow: none; color: var(--bg); }
    a.link.primary:hover, a.link.primary:active { background: #FFFFFF; }
    a.link.primary .what { color: #3D4752; }
    .glyph { display: grid; place-items: center; width: 40px; height: 40px; }
    .glyph svg { display: block; width: 26px; height: 26px; }
    .text { display: grid; min-width: 0; }
    .name { font-size: 18px; font-weight: 500; line-height: 1.25; }
    .what { overflow: hidden; color: var(--label); font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .arrow { width: 16px; height: 16px; opacity: 0.6; }
    footer { margin-top: auto; padding-top: 32px; color: var(--label); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="icon" src="../assets/icons/icon-192.png" alt="" width="88" height="88">
      <h1>FrontierSat</h1>
      <p class="sub">Calgary’s first student-built satellite</p>
    </header>
    <ul>
      <li>

          <span class="text"><span class="name">Website</span><span class="what">Its pictures, and where it is right now</span></span>
          <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </a>
      </li>
      <li>
        <a class="link" href="https://frontiersat.mooo.com/">
          <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 4.5h17v15h-17z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 15.5V12M12 15.5V8.5M17 15.5V10.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
          <span class="text"><span class="name">FrontierSat dashboard</span><span class="what">frontiersat.mooo.com</span></span>
          <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </a>
      </li>
      <li>
        <a class="link" href="https://www.instagram.com/calgarytospace/">
          <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="7" r="1.1" fill="currentColor"/></svg></span>
          <span class="text"><span class="name">Instagram</span><span class="what">@calgarytospace</span></span>
          <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </a>
      </li>
      <li>
        <a class="link" href="https://www.linkedin.com/company/calgarytospace/">
          <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V16.5M8 7.5v.5M11.5 16.5v-6M11.5 13c0-1.6 1-2.6 2.4-2.6s2.1 1 2.1 2.6v3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
          <span class="text"><span class="name">LinkedIn</span><span class="what">CalgaryToSpace</span></span>
          <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </a>
      </li>
    </ul>
  </main>
  <footer>FrontierSat (CTS-SAT-1), built by CalgaryToSpace</footer>
</body>
</html>
