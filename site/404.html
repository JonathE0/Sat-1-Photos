<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · FrontierSat</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070A">
  <!-- GitHub Pages serves this for any address it doesn't have, at any depth, so its links are
       from the site's root (/Sat-1-Photos/ there; the script below fixes them for a local copy) -->
  <link rel="icon" type="image/png" href="/Sat-1-Photos/assets/cubesat-icon.png" data-site-href="assets/cubesat-icon.png">
  <script>
    (function () {
      var path = location.pathname;
      var base = path.indexOf('/Sat-1-Photos/') === 0 ? '/Sat-1-Photos/' : '/';
      // a picture's address typed without its # (…/photo/ID, …/pictures, …/about) still gets there
      var rest = path.slice(base.length).replace(/\/+$/, '');
      if (/^(photo\/[^/]+|pictures|about)$/.test(rest)) {
        location.replace(base + '#/' + rest + location.search);
        return;
      }
      window.SITE_BASE = base;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #05070A;
      --raised: #1A2129;
      --fg: #E6EBF0;
      --bright: #F5F8FB;
      --label: #8A96A3;
      --accent: #3C9DF5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(32px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--fg);
      font-family: "Jost", "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    main { width: 100%; max-width: 34rem; }
    .icon { display: block; width: 72px; height: 72px; margin: 0 0 24px -8px; }
    .code { margin: 0 0 8px; color: var(--label); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; color: var(--fg); font-size: 32px; font-weight: 500; line-height: 1.2; letter-spacing: -0.01em; }
    p { margin: 0 0 28px; }
    /* the site's buttons: the primary Ink with dark words, the others a raised grey fill */
    .links { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .links a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 16px;
      background: var(--raised);
      color: var(--fg);
      font-weight: 500;
      text-decoration: none;
    }
    .links a:hover { background: color-mix(in srgb, var(--raised), var(--fg) 10%); }
    .links a.primary { background: var(--fg); color: var(--bg); }
    .links a.primary:hover { background: var(--bright); }
    .links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/Sat-1-Photos/assets/icons/icon-192.png" data-site-src="assets/icons/icon-192.png" alt="" width="72" height="72">
    <p class="code">404 · Page not found</p>
    <h1>This page isn’t in orbit</h1>
    <p>The link may be mistyped, or the page may have moved. FrontierSat and all its pictures are still here.</p>
    <ul class="links">
      <li><a class="primary" href="/Sat-1-Photos/" data-site-href="">Where FrontierSat is now</a></li>
      <li><a href="/Sat-1-Photos/#/pictures" data-site-href="#/pictures">All pictures</a></li>
      <li><a href="/Sat-1-Photos/globe/" data-site-href="globe/">Orbit</a></li>
    </ul>
  </main>
  <script>
    (function () {
      var base = window.SITE_BASE;
      if (!base || base === '/Sat-1-Photos/') return;
      document.querySelectorAll('[data-site-href]').forEach(function (el) { el.setAttribute('href', base + el.dataset.siteHref); });
      document.querySelectorAll('[data-site-src]').forEach(function (el) { el.setAttribute('src', base + el.dataset.siteSrc); });
    })();
  </script>
</body>
</html>
